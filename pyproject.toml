[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "binary-properties"
version = "0.1.0"
description = "BinProp: discover chess and Go concepts and use them to explain position differences"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ori Press"},
    {name = "Alexander Golubev"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["chess>=1.10", "sgfmill>=1.1.1"]

[project.scripts]
binary-properties = "binary_properties.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.package-data]
binary_properties = ["motifs/catalog.json", "motifs/chess/*.json", "motifs/go/*.json"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "I"]
